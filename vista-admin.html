<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista del administrador - Sonido Vivo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body class="vista-admin">  
    <div class="admin-container">
        <div class="admin-main">
            <header class="admin-header">
                <h1>¡HOLA Administrador!</h1>
            </header>
            <main class="admin-content">
                <div class="admin-mitad-superior">
                    <section class="admin-section">
                        <h2>Administración de productos</h2>
                        <div class="admin-actions">
                            <a href="agregar-producto.html" class="btn-enlace">Agregar producto</a>
                            <a href="editar-producto.html" class="btn-enlace">Editar producto</a>
                            <a href="eliminar-producto.html" class="btn-enlace">Eliminar producto</a>
                        </div>
                        <div id="admin-form-container"></div>
                    </section>
                </div>
                <div class="admin-mitad-inferior">
                    <section class="admin-section">
                        <h2>Administración de usuarios</h2>
                        <div class="admin-actions">
                            <a href="nuevo-usuario.html" class="btn-enlace">Agregar usuario</a>
                            <a href="editar-usuario.html" class="btn-enlace">Editar usuario</a>
                            <a href="eliminar-usuario.html" class="btn-enlace">Eliminar usuario</a>
                        </div>
                        <div id="admin-user-form-container"></div>
                    </section>
                </div>
                
            </main>
            
            <footer class="admin-footer">
                <p>© 2026 - Sonido Vivo</p>
            </footer>
        </div>
    </div>

</html>
