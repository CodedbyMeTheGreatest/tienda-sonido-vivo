<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Productos - Sonido Vivo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="logo-enlace">
            <img src="img/logo.png" alt="Sonido Vivo" class="logo-completo">
            <h1>Sonido Vivo</h1>
        </a>
        <button type="button" id="boton-menu" class="boton-menu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="nav-principal" class="nav-admin-productos">
            <a href="vista-admin.html">Inicio Administrador</a>
            <a href="agregar-producto.html">Agregar Productos</a>
            <a href="editar-producto.html">Editar Productos</a>
            <a href="eliminar-producto.html">Eliminar Productos</a>
        </nav>
    </header>
    <main>
        <section class="listado-admin" id="listado-productos-admin">
            <h2>Listado de Productos</h2>
            <div class="contenedor-tabla-admin" id="contenedor-tabla-productos-admin">
                <table class="tabla-admin" id="tabla-productos-admin">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Categoría</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Stock</th>
                            <th>Stock Crítico</th>
                            <th>Precio</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody class="cuerpo-tabla-admin" id="cuerpo-tabla-productos-admin">
                        <!-- Las filas se generan por JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 - Sonido Vivo</p>
    </footer>
</body>

</html>
