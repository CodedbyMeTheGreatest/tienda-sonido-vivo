<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Sonido Vivo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="logo-enlace">
            <img src="img/logo.png" alt="Sonido Vivo" class="logo-completo">
            <h1>Sonido Vivo</h1>
        </a>
        <button type="button" id="boton-menu" class="boton-menu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="nav-principal">
            <a href="index.html">Página Principal</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="blog.html">Blogs</a>
            <a href="index.html#Contáctanos">Contacto</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
            <a href="compra.html" class="enlace-carrito" aria-label="carrito">
                <img src="img/carrito.png" alt="carrito" class="imagen-carrito">
                <span id="contador-carrito" class="contador-carrito" hidden>0</span>
            </a>
        </nav>
    </header>
    <main>
        <section>
            <p>
                <a href="index.html">Página Principal</a> >
                <a href="catalogo.html">Catálogo</a> >
                <a id="breadcrumb-nombre">Cargando...</a>
            </p>
        </section>
        <section class="detalle-producto">
            <div class="imagenes-producto">
                <img id="detalle-imagen" src="img/placeholder.png" alt="Imagen del producto">
            </div>
            <div class="informacion-producto">
                <h3 id="detalle-titulo">Cargando producto...</h3>
                <p id="detalle-precio">$-</p>
            </div>
            <div class="descripcion-detalle-producto">
                <p id="detalle-descripcion"></p>
            </div>
            <div class="cantidad-detalle-producto">
                <p>Cantidad</p>
                <input id="detalle-cantidad" type="number" value="1" min="1">
            </div>
            <div class="boton-detalle-producto">
                <button id="boton-agregar-carrito" class="boton-detalle-añadir-producto" type="button" disabled>Añadir
                    al carrito</button>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 - Sonido Vivo</p>
    </footer>
</body>

</html>
