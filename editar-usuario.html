<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="logo-enlace">
            <img src="img/logo.png" alt="Sonido Vivo" class="logo-completo">
            <h1>Sonido Vivo</h1>
        </a>
        <button type="button" id="boton-menu" class="boton-menu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="nav-principal">
            <a href="vista-admin.html">Inicio Administrador</a>
            <a href="nuevo-usuario.html">Nuevo usuario</a>
            <a href="eliminar-usuario.html">Eliminar usuario</a>
            <a href="listado-usuario.html" class="btn-enlace">Listado de usuarios</a>
        </nav>
    </header>
    <main>
    <section>
        <h2>Edición de usuario via administrador</h2>
        <form class="admin-form" id="form-editar-admin" novalidate>
            <label for="run-completo">RUN</label>
            <input id="run-completo" type="text" required min="7" max="9" name="run" placeholder="123456789">
            <span class="error" id="error-run-completo"></span>

            <label for="nombres">Nombres</label>
            <input id="nombres" type="text" required max="50" name="nombres" placeholder="Ingrese sus nombres">
            <span class="error" id="error-nombres"></span>

            <label for="apellidos">Apellidos</label>
            <input id="apellidos" type="text" max="100" name="apellidos" required placeholder="Ingrese sus apellidos">
            <span class="error" id="error-apellidos"></span>

            <label for="correo">Correo</label>
            <input id="correo" type="email" name="correo" required max="100" placeholder="Ingrese su correo">
            <span class="error" id="error-correo"></span>

            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input id="fecha-nacimiento" name="fecha-nacimiento" type="date">
            <span class="error" id="error-fecha-nacimiento"></span>

            <label for="contraseña">Contraseña</label>
            <input type="password" name="contraseña" id="contraseña" required min="4" max="10"
                placeholder="Ingrese su contraseña">
            <span class="error" id="error-contraseña"></span>

            <label for="confirmar-contraseña">Confirmar contraseña</label>
            <input type="password" name="confirmar-contraseña" id="confirmar-contraseña" required min="4" max="10"
                placeholder="Confirme su contraseña">
            <span class="error" id="error-confirmar-contraseña"></span>

            <label for="region-registro">Región</label>
            <select name="region" id="region-registro" required>
                <option value="">Seleccione su región</option>
            </select>
            <span class="error" id="error-region-registro"></span>

            <label for="comuna-registro">Comuna</label>
            <select name="comuna" id="comuna-registro" placeholder="Seleccione su comuna" required>
                <option value="">Seleccione su comuna</option>
            </select>
            <span class="error" id="error-comuna-registro"></span>
            <label for="rol">Rol</label>
            <select name="rol" id="rol" required>
                <option value="">Seleccione su rol</option>
                <option value="cliente">Cliente</option>
                <option value="administrador">Administrador</option>
                <option value="vendedor">Vendedor</option>
            </select>
            <span class="error" id="error-rol"></span>

            <label for="direccion-registro">Direccion</label>
            <input type="text" id="direccion-registro" name="direccion" required max="300"
                placeholder="Ingrese su dirección">
            <span class="error" id="error-direccion-registro"></span>

            <button type="submit">Editar usuario</button>
            <p id="mensaje-confirmacion-edicion"></p>
        </form>
    </section>
    </main>
    <footer>
        <p>© 2026 - Sonido Vivo</p>
    </footer>
</body>

</html>
