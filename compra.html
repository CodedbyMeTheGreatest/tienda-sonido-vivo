<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body>
    <header>
       <a href="index.html" class="logo-enlace">
            <img src="img/logo.png" alt="Sonido Vivo" class="logo-completo">
            <h1>Sonido Vivo</h1>
        </a>
        <button type="button" id="boton-menu" class="boton-menu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="nav-principal">
            <a href="index.html">Página Principal</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="blog.html">Blogs</a>
            <a href="index.html#Contáctanos">Contacto</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
            <a href="compra.html" class="enlace-carrito" aria-label="carrito">
                <img src="img/carrito.png" alt="carrito" class="imagen-carrito">
                <span id="contador-carrito" class="contador-carrito" hidden>0</span>
            </a>
        </nav>
    </header>
    
    <main>
        <section>
            <h2 id="titulo-resumen">Resumen de tu pedido</h2>
            <div id="carrito">
            <p id="carrito-vacio" hidden>Tu carrito esta vacio. <a href="catalogo.html">Ir al catalogo.</a></p>
            </div>
            <p id="total-compra">Total: </p>
        </section>

        <section>
            <h2 id="titulo-datos">Datos de entrega y pago</h2>
            <form id="form-compra" novalidate>
                <label for="nombre-compra">Nombre completo</label>
                <input id="nombre-compra" name="nombre" type="text" required>
                <span class="error" id="error-nombre-compra"></span>

                <label for="correo-compra">Correo electronico</label>
                <input id="correo-compra" name="correo" type="email" required>
                <span class="error" id="error-correo-compra"></span>

                <label for="telefono-compra">Número de teléfono</label>
                <input id="telefono-compra" name="telefono" type="tel" required>
                <span class="error" id="error-telefono-compra"></span>

                <fieldset>
                    <legend>Forma de entrega</legend>
                    <label ><input type="radio" name="entrega" value="retiro" checked>Retiro en tienda</label>
                    <label ><input type="radio" name="entrega" value="despacho">Despacho a domicilio</label>
                </fieldset>

                <div id="direccion" hidden>
                    <label for="direccion-compra">Direccion de despacho</label>
                    <input id="direccion-compra" name="direccion" type="text">
                    <span class="error" id="error-direccion-compra"></span>
                </div>

                <label for="pago-compra">Forma de pago</label>
                <select name="pago" id="pago-compra" required>
                    <option value="">Selecciona una opcion</option>
                    <option value="transferencia">Transferencia</option>
                    <option value="webpay">Webpay</option>
                    <option value="efectivo">Efectivo en tienda</option>
                </select>
                <span class="error" id="error-pago-compra"></span>

                <button type="submit">Confirmar pedido</button>
                <p id="confirmacion-compra"></p>
            </form>
        </section>

    </main> 
    <footer>© 2026 - Sonido Vivo</footer>
</body>
</html>
