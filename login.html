<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body>
    <header>
        <h1>Sonido Vivo</h1>
        <nav>
            <a href="index.html">Página Principal</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="#nosotros">Nosotros</a>
            <a href="blog.html">Blogs</a>
            <a href="#contacto">Contacto</a>
            <a href="compra.html">Carrito</a>
        </nav>        
    </header>

    <main>
        <section>
            <h2>Inicio de sesion</h2>
            <form id="inicio-sesion" novalidate>
                <label for="correo">Correo</label>
                <input type="email" name="correo" id="correo" minlength="5" maxlength="100" required>

                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" minlength="4" maxlength="10" required>

                <button type="submit">Iniciar sesion</button>
                <p id="mensaje-confirmacion-login"></p>


            </form>
        </section>

    </main>
    <footer>
        <p>© 2026 - Sonido Vivo</p>        
    </footer>
</body>
</html>
